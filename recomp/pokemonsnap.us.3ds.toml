# N64Recomp config for the Pokemon Snap 3DS port (same route as Megaman643DS).
# Symbols: Snap64Recomp's tracked patches/pokemonsnap.syms.toml (GPL-3.0, generated from the
# ethteck/pokemonsnap decomp), so no decomp/IDO build is needed. manual_funcs fill .main's gaps
# (static callbacks), copied from Snap64Recomp's pokemonsnap.us.toml. N64Recomp ignores
# manual_funcs with a symbols file, so tools/add_manual_funcs.py has merged them into
# pokemonsnap.syms.toml; the list stays here as the record of what was added.
# Run (from recomp/): ../tools/n64recomp/N64Recomp.exe pokemonsnap.us.3ds.toml

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
symbols_file_path = "pokemonsnap.syms.toml"
rom_file_path = "../rom/pokemonsnap.us.z64"
# Debugging: record every function entry (source/port/trace.h). Costs one store per call.
trace_mode = true
# Declares the hook functions below (source/port/snap_hooks.h)
recomp_include = """#include "recomp.h"
#include "snap_hooks.h\""""

manual_funcs = [
    { name = "manualfunc_8001FE88", section = ".main", vram = 0x8001FE88, size = 0xB8 },
    { name = "manualfunc_8001FF40", section = ".main", vram = 0x8001FF40, size = 0x98 },
    { name = "manualfunc_8001FFD8", section = ".main", vram = 0x8001FFD8, size = 0xC4 },
    { name = "manualfunc_80028DA4", section = ".main", vram = 0x80028DA4, size = 0x254 },
    { name = "manualfunc_800294D4", section = ".main", vram = 0x800294D4, size = 0x6C },
    { name = "manualfunc_8002966C", section = ".main", vram = 0x8002966C, size = 0xA8 },
    { name = "manualfunc_80029714", section = ".main", vram = 0x80029714, size = 0x410 },
    { name = "manualfunc_80029B24", section = ".main", vram = 0x80029B24, size = 0xEC },
    { name = "manualfunc_8002C958", section = ".main", vram = 0x8002C958, size = 0x2E8 },
    { name = "manualfunc_8002CD54", section = ".main", vram = 0x8002CD54, size = 0x28C },
    { name = "manualfunc_8002DC94", section = ".main", vram = 0x8002DC94, size = 0x14C },
    { name = "manualfunc_8002E2F8", section = ".main", vram = 0x8002E2F8, size = 0x6F0 },
    { name = "manualfunc_8002EA58", section = ".main", vram = 0x8002EA58, size = 0xC8 },
    { name = "manualfunc_8002EB20", section = ".main", vram = 0x8002EB20, size = 0x10E4 },
    { name = "manualfunc_8002FC04", section = ".main", vram = 0x8002FC04, size = 0x190 },
    { name = "manualfunc_8002FD94", section = ".main", vram = 0x8002FD94, size = 0xE0 },
    { name = "manualfunc_8002FE74", section = ".main", vram = 0x8002FE74, size = 0x20C },
    { name = "manualfunc_8003020C", section = ".main", vram = 0x8003020C, size = 0x550 },
    { name = "manualfunc_80030838", section = ".main", vram = 0x80030838, size = 0xB4 },
    { name = "manualfunc_800308EC", section = ".main", vram = 0x800308EC, size = 0x89C },
